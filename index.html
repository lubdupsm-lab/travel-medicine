<style>
:root{--navy:#0d1b2e;--navy-mid:#152540;--navy-light:#1e3358;--gold:#c9a84c;--gold-light:#e8c96a;--red:#c0392b;--orange:#e67e22;--yellow:#f1c40f;--purple:#8e44ad;--green:#27ae60;--teal:#16a085;--pink:#e91e8c;--blue:#3498db;--grey-safe:#8e9eab;--white:#f8f9fa;--offwhite:#e8edf5;--border:rgba(201,168,76,0.25)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--white);min-height:100vh}
body.ar{font-family:'IBM Plex Sans Arabic',sans-serif}
body.ar .keep-ltr{direction:ltr;unicode-bidi:embed}
header{background:linear-gradient(135deg,var(--navy),var(--navy-light));border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:12px}
.header-left h1{font-family:'Crimson Pro',serif;font-size:1.4rem;font-weight:700;color:var(--gold-light)}
body.ar .header-left h1{font-family:'IBM Plex Sans Arabic',sans-serif}
.header-left p{font-size:.7rem;color:rgba(248,249,250,.5);font-weight:300;margin-top:2px;letter-spacing:.05em;text-transform:uppercase}
body.ar .header-left p{text-transform:none;letter-spacing:0}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.source-badge{font-size:.62rem;color:var(--gold);border:1px solid var(--border);padding:4px 9px;border-radius:20px}
.lang-toggle{display:flex;border:1px solid var(--gold);border-radius:20px;overflow:hidden;cursor:pointer}
.lang-toggle span{padding:5px 14px;font-size:.74rem;font-weight:600;transition:all .2s}
.lang-toggle .lt-active{background:var(--gold);color:var(--navy)}
.lang-toggle .lt-inactive{color:var(--gold)}
.app{display:grid;grid-template-columns:1fr 400px;height:calc(100vh - 70px)}
body.ar .app{grid-template-columns:400px 1fr}
@media(max-width:1000px){.app,body.ar .app{grid-template-columns:1fr;height:auto}}
.map-side{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--border)}
body.ar .map-side{border-right:none;border-left:1px solid var(--border)}
.controls{padding:12px 20px;background:var(--navy-mid);border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:340px}
.search-wrap input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--white);padding:9px 14px 9px 36px;border-radius:8px;font-family:inherit;font-size:.82rem;outline:none}
body.ar .search-wrap input{padding:9px 36px 9px 14px;text-align:right}
.search-wrap input:focus{border-color:var(--gold)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.4}
body.ar .search-icon{left:auto;right:11px}
.traveler-filter{display:flex;gap:6px;flex-wrap:wrap}
.tf-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:rgba(255,255,255,.65);font-size:.72rem;cursor:pointer;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:5px}
.tf-btn:hover,.tf-btn.active{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:600}
#mapContainer{flex:1;position:relative;background:var(--navy);min-height:420px}
.datamaps-hoverover{background:var(--navy-mid)!important;border:1px solid var(--gold)!important;color:var(--white)!important;font-family:inherit!important;padding:8px 12px!important;border-radius:6px!important;font-size:.78rem!important}
.map-legend{padding:10px 20px;background:var(--navy-mid);border-top:1px solid var(--border);display:flex;gap:14px;flex-wrap:wrap;font-size:.68rem}
.layer-control{display:flex;align-items:center;gap:8px}
.layer-control label{font-size:.72rem;color:var(--gold);font-weight:600}
.layer-control select{background:rgba(255,255,255,.06);border:1px solid var(--gold);color:var(--white);padding:7px 12px;border-radius:7px;font-family:inherit;font-size:.78rem;cursor:pointer;outline:none}
.layer-control select option{background:var(--navy-mid);color:var(--white)}
body.ar .layer-control select{text-align:right}
.leg-item{display:flex;align-items:center;gap:5px;color:var(--offwhite)}
.leg-sw{width:13px;height:13px;border-radius:3px}
.detail-panel{background:var(--navy);overflow-y:auto;padding:22px}
body.ar .detail-panel{text-align:right}
.detail-panel::-webkit-scrollbar{width:5px}.detail-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.tabs{display:flex;gap:4px;margin-bottom:18px;background:var(--navy-mid);padding:4px;border-radius:10px;border:1px solid var(--border)}
.tab{flex:1;padding:8px 4px;text-align:center;font-size:.7rem;font-weight:500;cursor:pointer;border-radius:7px;transition:all .2s;color:rgba(255,255,255,.5)}
.tab.active{background:var(--gold);color:var(--navy);font-weight:700}
.tab-content{display:none}.tab-content.active{display:block}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:50%;opacity:.3;text-align:center;gap:12px;margin-top:40px}
.empty-state .globe{font-size:3rem}
.country-header{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.country-header h2{font-family:'Crimson Pro',serif;font-size:1.7rem;font-weight:700;color:var(--gold-light)}
body.ar .country-header h2{font-family:'IBM Plex Sans Arabic',sans-serif}
.country-region{font-size:.7rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em}
.btn-export{background:var(--gold);color:var(--navy);border:none;padding:8px 14px;border-radius:7px;font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
.btn-export:hover{background:var(--gold-light)}
.verify-flag{background:rgba(52,152,219,.1);border:1px solid rgba(52,152,219,.3);border-radius:8px;padding:10px 12px;font-size:.72rem;color:#74b9ff;margin-bottom:14px;line-height:1.5}
.risk-overview{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
body.ar .risk-overview{justify-content:flex-end}
.risk-badge{display:flex;align-items:center;gap:5px;padding:6px 11px;border-radius:20px;font-size:.7rem;font-weight:600;border:1px solid}
.section{margin-bottom:20px}
.section-title{font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:9px;display:flex;align-items:center;gap:8px}
body.ar .section-title{letter-spacing:0;text-transform:none;font-size:.8rem}
.section-title::after{content:'';flex:1;height:1px;background:var(--border)}
.vaccine-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(255,255,255,.04);border-radius:6px;border:1px solid var(--border);margin-bottom:5px}
.vaccine-name{font-size:.8rem;font-weight:500}
.vaccine-type{font-size:.62rem;padding:3px 8px;border-radius:10px;font-weight:600}
.type-required{background:rgba(192,57,43,.2);color:#e74c3c;border:1px solid rgba(192,57,43,.3)}
.type-recommended{background:rgba(39,174,96,.2);color:#2ecc71;border:1px solid rgba(39,174,96,.3)}
.type-routine{background:rgba(52,152,219,.2);color:#74b9ff;border:1px solid rgba(52,152,219,.3)}
.malaria-box{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:13px}
.malaria-risk-level{font-size:.8rem;font-weight:600;margin-bottom:7px}
.malaria-drug{background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.2);border-radius:6px;padding:10px 12px;margin-top:7px}
.drug-name{font-size:.8rem;font-weight:600;color:#e74c3c;margin-bottom:3px}
.drug-detail{font-size:.72rem;color:rgba(255,255,255,.55);line-height:1.5}
.counseling-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.counseling-list li{font-size:.77rem;color:rgba(255,255,255,.78);padding:8px 12px;background:rgba(255,255,255,.04);border-radius:6px;border-left:2px solid var(--gold);line-height:1.5}
body.ar .counseling-list li{border-left:none;border-right:2px solid var(--gold)}
.alert-box{background:rgba(231,76,60,.1);border:1px solid rgba(231,76,60,.3);border-radius:8px;padding:11px 13px;font-size:.77rem;color:#e74c3c;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start;line-height:1.5}
.tf-alert{background:rgba(241,196,15,.12);border:1px solid rgba(241,196,15,.35);border-radius:8px;padding:11px 13px;font-size:.77rem;color:var(--gold-light);margin-bottom:14px;line-height:1.5}
.ref-table{width:100%;border-collapse:collapse;font-size:.75rem}
.ref-table th{background:var(--navy-light);color:var(--gold);padding:8px 10px;text-align:left;font-size:.63rem;letter-spacing:.06em;text-transform:uppercase}
body.ar .ref-table th{text-align:right;letter-spacing:0;text-transform:none}
.ref-table td{padding:8px 10px;border-bottom:1px solid var(--border);color:rgba(255,255,255,.8);line-height:1.4;vertical-align:top}
.kit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kit-item{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;padding:11px;display:flex;align-items:center;gap:9px;font-size:.74rem}
.specialist-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.specialist-list li{font-size:.76rem;padding:8px 12px;background:rgba(231,76,60,.07);border-left:2px solid #e74c3c;border-radius:0 6px 6px 0;color:rgba(255,255,255,.8);line-height:1.4}
body.ar .specialist-list li{border-left:none;border-right:2px solid #e74c3c;border-radius:6px 0 0 6px}
.footer-credit{margin-top:22px;padding-top:14px;border-top:1px solid var(--border);font-size:.64rem;color:rgba(255,255,255,.3);line-height:1.7}
@media print{body{background:#fff;color:#000}header,.map-side,.tabs,.btn-export,.tf-alert{display:none!important}.app{display:block;height:auto}.detail-panel{padding:0}.detail-panel *{color:#000!important}.counseling-list li,.vaccine-item,.malaria-box,.alert-box{background:#f5f5f5!important;border-color:#ccc!important}}
</style>

const DL = {"en":{"yellow_fever":"Yellow Fever","malaria":"Malaria","meningitis":"Meningitis Belt","japanese_encephalitis":"Japanese Encephalitis","dengue":"Dengue","zika":"Zika","chikungunya":"Chikungunya","altitude":"Altitude","typhoid":"Typhoid","cholera":"Cholera","schistosomiasis":"Schistosomiasis","polio":"Polio"},"ar":{"yellow_fever":"الحمى الصفراء (Yellow Fever)","malaria":"الملاريا (Malaria)","meningitis":"حزام التهاب السحايا (Meningitis)","japanese_encephalitis":"التهاب الدماغ الياباني (JE)","dengue":"حمى الضنك (Dengue)","zika":"زيكا (Zika)","chikungunya":"شيكونغونيا (Chikungunya)","altitude":"داء المرتفعات (Altitude)","typhoid":"التيفوئيد (Typhoid)","cholera":"الكوليرا (Cholera)","schistosomiasis":"البلهارسيا (Schistosomiasis)","polio":"شلل الأطفال (Polio)"}};
const C={yellow_fever:'#f1c40f',malaria:'#c0392b',malaria_low:'#e67e22',meningitis:'#8e44ad',japanese_encephalitis:'#27ae60',dengue:'#e91e8c',zika:'#3498db',chikungunya:'#d6336c',altitude:'#5dade2',typhoid:'#d35400',cholera:'#16a085',schistosomiasis:'#1abc9c',safe:'#8e9eab'};
const byIso={}; COUNTRIES.forEach(c=>byIso[c.iso]=c);
let lang='en', travelerType='standard', selected=null;
const t=k=>I18N[lang][k]||k;

let activeLayer='overall';
// Severity palette (sequential, one axis)
const SEV={none:'#8e9eab',low:'#27ae60',mod:'#e67e22',high:'#c0392b',nodata:'#2c3e50'};
const MAL={none:'#8e9eab',sens:'#f4d35e',res:'#e67e22',mef:'#922b21',nodata:'#2c3e50'};
const YFP={endemic:'#f1c40f',no:'#8e9eab',nodata:'#2c3e50'};
const VAC={none:'#8e9eab',med:'#5dade2',high:'#2471a3',nodata:'#2c3e50'};
const ARBO={none:'#8e9eab',some:'#e91e8c',high:'#a4133c',nodata:'#2c3e50'};
function arboCat(c){const a=['dengue','zika','chikungunya'].filter(r=>c.risks.includes(r)).length;return a>=2?'high':(a>=1?'some':'none');}

function overallSev(c){
  if(c.risks.length===0) return 'none';
  let score=c.risks.length;
  if(c.malaria_level==='high') score+=2;
  else if(c.malaria_level==='low') score+=1;
  if(c.risks.includes('yellow_fever')) score+=1;
  if(score>=5) return 'high';
  if(score>=2) return 'mod';
  return 'low';
}
function malariaCat(c){
  if(c.malaria_level==='none') return 'none';
  const d=(c.malaria_drug||'').toLowerCase();
  if(d.includes('mefloquine')&&d.includes('only')) return 'mef';
  if(c.malaria_resistant) return 'res';
  return 'sens';
}
function colorForLayer(c){
  if(!c) return '#2c3e50';
  if(activeLayer==='overall') return SEV[overallSev(c)];
  if(activeLayer==='malaria') return MAL[malariaCat(c)];
  if(activeLayer==='yf') return c.risks.includes('yellow_fever')?YFP.endemic:YFP.no;
  if(activeLayer==='vaccine'){const n=c.vaccines.filter(v=>v.type!=='routine').length;return n>=3?VAC.high:(n>=1?VAC.med:VAC.none);}
  if(activeLayer==='arbo')return ARBO[arboCat(c)];
  return '#2c3e50';
}
const dataset={};
COUNTRIES.forEach(c=>{dataset[c.iso]={name:c.name};});
function buildFills(){const f={defaultFill:'#2c3e50'};COUNTRIES.forEach(c=>{const k='k'+c.iso;f[k]=colorForLayer(c);dataset[c.iso].fillKey=k;});return f;}
let fills=buildFills();

let map;
function initMap(){
  // D3 writes each country's geography onto the path as __data__. In current Chrome that makes
  // mouse clicks hit the parent group, so click never fires. pointerup still targets the path.
  map=new Datamap({element:document.getElementById('mapContainer'),projection:'mercator',fills:fills,data:dataset,
    geographyConfig:{borderColor:'#1e3358',borderWidth:0.5,highlightFillColor:'#c9a84c',highlightBorderColor:'#e8c96a',
      popupTemplate:function(geo,d){const c=byIso[geo.id];if(!c)return'<div class="datamaps-hoverover">'+geo.properties.name+'</div>';const rt=c.risks.length?c.risks.map(r=>DL[lang][r]||r).join(lang==='ar'?'، ':', '):t('noRisk');return'<div class="datamaps-hoverover"><strong>'+c.name+'</strong><br><span style="font-size:.7rem;opacity:.8">'+rt+'</span></div>';}},
    done:function(dm){function openGeo(geo){const c=byIso[geo.id];if(c)selectCountry(c.iso);}dm.svg.selectAll('.datamaps-subunit').on('click',function(geo){openGeo(geo);}).each(function(geo){this.addEventListener('pointerup',function(e){if(e.button!==0)return;openGeo(geo);});});}});
  window.addEventListener('resize',()=>{if(map)map.resize();});
}
function showToast(msg, type){
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; document.body.appendChild(el);
    el.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:9999;padding:10px 20px;border-radius:8px;font-family:inherit;font-size:.85rem;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.35);transition:opacity .3s,transform .3s;pointer-events:none;';
  }
  el.textContent=msg;
  el.style.background= type==='error' ? '#c0392b' : (type==='success' ? '#27ae60' : '#1e3358');
  el.style.color='#fff';
  el.style.opacity='1'; el.style.transform='translateX(-50%) translateY(0)';
  clearTimeout(el._t);
  el._t=setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateX(-50%) translateY(10px)'; }, 2200);
}
function updateMapColors(){
  try{
    fills=buildFills();
    if(map && typeof map.updateChoropleth==='function'){
      const upd={};
      COUNTRIES.forEach(c=>{upd[c.iso]={fillColor:colorForLayer(c)};});
      map.options.fills=fills;
      map.updateChoropleth(upd);
      const names={overall:t('layerOverall'),malaria:t('layerMalaria'),yf:t('layerYF'),arbo:t('layerArbo'),vaccine:t('layerVaccine')};
      showToast((lang==='ar'?'تم تغيير العرض إلى: ':'View changed to: ')+(names[activeLayer]||activeLayer),'info');
    } else {
      showToast(lang==='ar'?'تعذّر تحديث الخريطة — أعد تحميل الصفحة':'Could not update map — please reload','error');
    }
  } catch(err){
    console.error('Layer update failed:',err);
    showToast(lang==='ar'?'حدث خطأ أثناء تغيير الطبقة':'Error changing map layer','error');
  }
}

function travelerAlert(c){
  if(travelerType==='standard')return'';
  const P=lang==='ar';
  if(travelerType==='pregnant'){let m=[P?'اللقاحات الحية ممنوعة: Yellow Fever, MMR, Varicella, oral Typhoid.':'Live vaccines contraindicated: Yellow Fever, MMR, Varicella, oral Typhoid.'];
    if(c.risks.includes('zika'))m.push(P?'⚠ منطقة ZIKA — يُنصح بتأجيل أو تجنب السفر (مُشوِّه للأجنة).':'⚠ ZIKA ZONE — advise avoiding or delaying travel (teratogenic).');
    if(c.malaria_level==='high')m.push(P?'خطر ملاريا عالٍ — Doxycycline ممنوع؛ يُنظر في Atovaquone-Proguanil أو Mefloquine؛ يُفضّل التحويل للأخصائي.':'High malaria risk — Doxycycline contraindicated; consider Atovaquone-Proguanil or Mefloquine; specialist referral advised.');
    if(c.risks.includes('yellow_fever'))m.push(P?'لقاح Yellow Fever يُتجنّب عادة في الحمل — حوِّل للأخصائي لتقييم المنفعة/الخطر.':'Yellow Fever vaccine generally avoided in pregnancy — refer for risk-benefit.');
    return(P?'🤰 مسافرة حامل: ':'🤰 Pregnant traveler: ')+m.join(' ');}
  if(travelerType==='child'){let m=[P?'Doxycycline ممنوع تحت سن 8 سنوات.':'Doxycycline contraindicated under 8 years.'];
    if(c.risks.includes('yellow_fever'))m.push(P?'لقاح Yellow Fever لا يُعطى تحت 6 أشهر؛ بحذر 6–9 أشهر.':'Yellow Fever vaccine NOT given <6 months; caution 6–9 months.');
    if(c.malaria_level!=='none')m.push(P?'طفل أقل من سنتين إلى منطقة ملاريا — حوِّل للأخصائي (REFER).':'Child <2y to malaria zone — REFER to specialist.');
    return(P?'👶 طفل أقل من سنتين: ':'👶 Child <2 years: ')+m.join(' ');}
  if(travelerType==='immuno'){let m=[P?'لا لقاحات حية: Yellow Fever, MMR, Varicella, oral Typhoid, oral Cholera.':'NO live vaccines: Yellow Fever, MMR, Varicella, oral Typhoid, oral Cholera.',
    P?'اللقاحات غير الحية قد تكون أقل فعالية.':'Inactivated vaccines may have reduced efficacy.'];
    if(c.malaria_level==='high')m.push(P?'خطر ملاريا أعلى ونتائج أسوأ — وقاية صارمة.':'Higher malaria risk and worse outcomes — strict prophylaxis.');
    m.push(P?'حوِّل دائماً لأخصائي طب السفر.':'ALWAYS refer to travel medicine specialist.');
    return(P?'💉 نقص المناعة: ':'💉 Immunocompromised: ')+m.join(' ');}
  return'';
}

  document.getElementById('tab-malaria').innerHTML='<div class="section-title">'+t('malaria')+' — Chemoprophylaxis</div><table class="ref-table"><thead><tr><th>'+t('drug')+'</th><th>'+t('zone')+'</th><th>'+t('avoidIf')+'</th></tr></thead><tbody><tr><td class="keep-ltr"><strong>Atovaquone–Proguanil</strong></td><td class="keep-ltr">All zones incl. resistant; 1st choice Thai borders</td><td class="keep-ltr">CrCl &lt;30</td></tr><tr><td class="keep-ltr"><strong>Doxycycline</strong></td><td class="keep-ltr">All zones; 2nd Thai borders</td><td class="keep-ltr">Pregnancy, &lt;8y, photosensitivity</td></tr><tr><td class="keep-ltr"><strong>Mefloquine</strong></td><td class="keep-ltr">Resistant — NOT Thai borders</td><td class="keep-ltr">Depression, psychosis, seizures</td></tr><tr><td class="keep-ltr"><strong>Chloroquine</strong></td><td class="keep-ltr">Sensitive zones only</td><td class="keep-ltr">Psoriasis, porphyria, retinopathy</td></tr></tbody></table>';
  const refList=lang==='ar'?['نقص المناعة (HIV, transplant, chemotherapy, biologics)','الحمل — خاصة لمناطق الملاريا أو Yellow Fever','طفل أقل من سنتين لمنطقة ملاريا أو Yellow Fever','حساسية شديدة للقاح أو تفاعل خطير سابق','اضطراب صرع أو نفسي شديد','مرض مزمن شديد (قلب، كبد، كلى)','سفر في اللحظة الأخيرة (أقل من أسبوع)','رحلة متعددة الوجهات أو طويلة (>6 أشهر)']:['Immunocompromised (HIV, transplant, chemotherapy, biologics)','Pregnant — especially to malaria or Yellow Fever zones','Child under 2 years to malaria or Yellow Fever zone','Severe vaccine allergy or prior serious reaction','Seizure or severe psychiatric disorder','Severe chronic illness (heart, liver, kidney)','Last-minute travel (<1 week)','Complex multi-destination or long-term (>6 months)'];
  const kit=lang==='ar'?[['🧴','معقّم اليدين'],['💧','أملاح الإماهة (ORS)'],['🦟','طارد حشرات DEET≥30%'],['☀️','واقٍ شمسي SPF 30+'],['💊','مسكّن/خافض حرارة'],['🩹','ضمادات وعناية بالجروح'],['🧻','مناديل مطهّرة'],['💩','علاج الإسهال'],['🦠','مضاد حيوي احتياطي Azithromycin'],['📋','أدوية إضافية + مستندات']]:[['🧴','Hand Sanitizer'],['💧','Oral Rehydration Salts'],['🦟','Insect Repellent DEET≥30%'],['☀️','Sunscreen SPF 30+'],['💊','Pain Reliever/Antipyretic'],['🩹','Bandages & Wound Care'],['🧻','Antiseptic Wipes'],['💩','Diarrhea Treatment'],['🦠','Standby Azithromycin'],['📋','Extra Meds + Documents']];
  document.getElementById('tab-refer').innerHTML='<div class="section-title">'+t('refer')+'</div><ul class="specialist-list">'+refList.map(x=>'<li>'+x+'</li>').join('')+'</ul><div class="section-title" style="margin-top:18px">'+t('kit')+'</div><div class="kit-grid">'+kit.map(([i,n])=>'<div class="kit-item">'+i+' '+n+'</div>').join('')+'</div><div class="footer-credit">Created by <strong>Dr. Zeyad Halawani</strong>, Family Medicine Resident, MNG-HA, Madinah<br>Sources: CDC Yellow Book 2026 · WHO International Travel and Health · ISTM 2024 · Information current as of May 2026</div>';
}

function switchTab(tb){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tb));document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+tb).classList.add('active');}
document.querySelectorAll('.tab').forEach(tb=>tb.addEventListener('click',()=>switchTab(tb.dataset.tab)));
document.querySelectorAll('.tf-btn').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tf-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active');travelerType=b.dataset.tf;if(selected)selectCountry(selected.iso);}));

const si=document.getElementById('searchInput'),sr=document.getElementById('searchResults');
si.addEventListener('input',()=>{const q=si.value.toLowerCase().trim();if(!q){sr.style.display='none';return;}const m=COUNTRIES.filter(c=>c.name.toLowerCase().includes(q)||c.region.toLowerCase().includes(q)).slice(0,8);if(!m.length){sr.style.display='none';return;}sr.innerHTML=m.map(c=>'<div style="padding:9px 13px;cursor:pointer;border-bottom:1px solid rgba(201,168,76,.15);font-size:.8rem" onclick="pickSearch(\''+c.iso+'\')">'+c.name+' <span style="opacity:.4;font-size:.7rem">'+c.region+'</span></div>').join('');sr.style.display='block';});
function pickSearch(iso){sr.style.display='none';si.value=byIso[iso].name;selectCountry(iso);}
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))sr.style.display='none';});

function exportSummaryWithFeedback(btn){
  if(!selected) return;
  const origHTML=btn.innerHTML;
  btn.disabled=true;
  btn.innerHTML=(lang==='ar'?'⏳ جارٍ الفتح…':'⏳ Opening…');
  try{
    const res=exportSummary();
    if(res===false){
      showToast(lang==='ar'?'مانع النوافذ المنبثقة يمنع فتح الورقة — اسمح بالنوافذ المنبثقة':'Pop-up blocked — please allow pop-ups to open the sheet','error');
    } else {
      showToast(lang==='ar'?'تم فتح ورقة المريض في تبويب جديد ✓':'Patient sheet opened in a new tab ✓','success');
    }
  } catch(err){
    console.error('Export failed:',err);
    showToast(lang==='ar'?'تعذّر إنشاء ورقة المريض':'Could not generate patient sheet','error');
  } finally {
    setTimeout(()=>{ btn.disabled=false; btn.innerHTML=origHTML; }, 1200);
  }
}
function exportSummary(){if(!selected)return null;const c=selected;const tf=travelerAlert(c);const P=lang==='ar';const w=window.open('','_blank');if(!w)return false;const vr=c.vaccines.map(v=>'<tr><td class="ltr">'+v.name+'</td><td>'+t(v.type)+'</td></tr>').join('');
w.document.write('<!DOCTYPE html><html dir="'+(P?'rtl':'ltr')+'" lang="'+lang+'"><head><meta charset="UTF-8"><title>'+(P?'ملخص ما قبل السفر':'Pre-Travel Summary')+' — '+c.name+'</title><style>body{font-family:'+(P?'Arial':'Georgia,serif')+';max-width:780px;margin:30px auto;padding:0 30px;color:#1a1a1a;line-height:1.6}.ltr{direction:ltr;unicode-bidi:embed;display:inline-block}h1{color:#0d1b2e;border-bottom:3px solid #c9a84c;padding-bottom:8px}h2{color:#0d1b2e;font-size:1.05rem;margin-top:22px;border-'+(P?'right':'left')+':4px solid #c9a84c;padding-'+(P?'right':'left')+':10px}table{width:100%;border-collapse:collapse;margin:8px 0;font-size:.85rem}th{background:#0d1b2e;color:#fff;padding:8px;text-align:'+(P?'right':'left')+'}td{padding:7px 8px;border-bottom:1px solid #ddd}.alert{background:#fdf0ed;border:1px solid #e74c3c;color:#922b21;padding:11px;border-radius:6px;margin:10px 0}.tf{background:#fdf8e8;border:1px solid #c9a84c;color:#7a5c00;padding:11px;border-radius:6px;margin:10px 0}.pt{margin:14px 0;padding:10px;background:#f5f5f5;border-radius:6px}.foot{margin-top:30px;padding-top:14px;border-top:1px solid #ccc;font-size:.72rem;color:#888}button{background:#c9a84c;border:none;padding:10px 18px;border-radius:6px;cursor:pointer}@media print{.noprint{display:none}}</style></head><body><div class="noprint" style="text-align:'+(P?'left':'right')+';margin-bottom:14px"><button onclick="window.print()">🖨 '+(P?'طباعة / حفظ PDF':'Print / Save as PDF')+'</button></div><h1>'+(P?'ملخص صحي ما قبل السفر':'Pre-Travel Health Summary')+'</h1><p>'+(P?'الوجهة':'Destination')+': <strong>'+c.name+'</strong> ('+c.region+')</p><div class="pt">'+(P?'اسم المريض':'Patient name')+': __________  '+(P?'التاريخ':'Date')+': ______  '+(P?'تاريخ السفر':'Departure')+': ______</div>'+((P&&!c.unverified&&c.alerts_ar&&c.alerts_ar.length?c.alerts_ar:c.alerts).length?'<div class="alert"><strong>⚠ '+(P?'تنبيهات':'Alerts')+':</strong> '+(P&&!c.unverified&&c.alerts_ar&&c.alerts_ar.length?c.alerts_ar:c.alerts).join(' • ')+'</div>':'')+(tf?'<div class="tf"><strong>'+(P?'ملاحظة لفئة خاصة':'Special population')+':</strong> '+tf+'</div>':'')+'<h2>'+(P?'اللقاحات الموصى بها':'Recommended Vaccines')+'</h2><table><tr><th>'+t('vaccine')+'</th><th>'+(P?'الفئة':'Category')+'</th></tr>'+vr+'</table><h2>'+t('malaria')+'</h2><p>'+(c.malaria_level!=='none'?'<strong>'+(c.malaria_level==='high'?t('highMalaria'):t('lowMalaria'))+'.</strong> <span class="ltr">'+c.malaria_drug+'</span>':t('noMalaria'))+'</p><h2>'+t('counseling')+'</h2><ul>'+((P&&!c.unverified&&c.counseling_ar&&c.counseling_ar.length)?c.counseling_ar:c.counseling).map(x=>'<li>'+x+'</li>').join('')+'</ul>'+(c.foodwater?('<h2>'+t('foodwater')+'</h2><p>'+((P&&!c.unverified&&c.foodwater_ar)?c.foodwater_ar:c.foodwater)+'</p>'):'')+(c.health_visa?('<h2>'+t('health_visa')+'</h2><p>'+((P&&!c.unverified&&c.health_visa_ar)?c.health_visa_ar:c.health_visa)+'</p>'):'')+'<div class="foot">Prepared with the Travel Medicine Reference Map by Dr. Zeyad Halawani, MNG-HA, Madinah. Sources: CDC Yellow Book 2026 · WHO International Travel and Health · ISTM 2024 · Information current as of May 2026. Clinical aid only.</div></body></html>');w.document.close();return w;}

function applyLang(){
  document.body.classList.toggle('ar',lang==='ar');
  document.getElementById('htmlRoot').setAttribute('dir',lang==='ar'?'rtl':'ltr');
  document.getElementById('htmlRoot').setAttribute('lang',lang);
  document.getElementById('hTitle').textContent=t('title');
  document.getElementById('hSub').textContent=t('subtitle');
  si.placeholder=t('search');
  document.querySelector('[data-tf=standard]').textContent='🧍 '+t('standard');
  document.querySelector('[data-tf=pregnant]').textContent='🤰 '+t('pregnant');
  document.querySelector('[data-tf=child]').textContent='👶 '+t('child');
  document.querySelector('[data-tf=immuno]').textContent='💉 '+t('immuno');
  document.querySelector('[data-tab=country]').textContent=t('tabCountry');
  document.querySelector('[data-tab=vaccines]').textContent=t('tabVaccines');
  document.querySelector('[data-tab=malaria]').textContent=t('tabMalaria');
  document.querySelector('[data-tab=refer]').textContent=t('tabRefer');
  var em=document.getElementById('emptyMsg'); if(em) em.innerHTML=t('emptyState');
  populateLayerSelect();renderLegend();
  document.querySelectorAll('#langToggle span').forEach(s=>{s.className=s.dataset.lang===lang?'lt-active':'lt-inactive';});
  buildStaticTabs();
  if(selected)selectCountry(selected.iso);
}
function renderLegend(){
  let items=[];
  if(activeLayer==='overall') items=[[SEV.high,t('sevHigh')],[SEV.mod,t('sevMod')],[SEV.low,t('sevLow')],[SEV.none,t('sevNone')]];
  else if(activeLayer==='malaria') items=[[MAL.mef,t('malMef')],[MAL.res,t('malRes')],[MAL.sens,t('malSens')],[MAL.none,t('malNone')]];
  else if(activeLayer==='yf') items=[[YFP.endemic,t('yfEndemic')],[YFP.no,t('yfNo')]];
  else if(activeLayer==='vaccine') items=[[VAC.high,t('vacHigh')],[VAC.med,t('vacMed')],[VAC.none,t('vacNone')]];
  else if(activeLayer==='arbo') items=[[ARBO.high,t('arboHigh')],[ARBO.some,t('arboSome')],[ARBO.none,t('arboNone')]];
  document.getElementById('mapLegend').innerHTML=items.map(([col,lbl])=>'<div class="leg-item"><span class="leg-sw" style="background:'+col+'"></span>'+lbl+'</div>').join('');
}
function populateLayerSelect(){
  const sel=document.getElementById('layerSelect');
  const opts=[['overall',t('layerOverall')],['malaria',t('layerMalaria')],['yf',t('layerYF')],['arbo',t('layerArbo')],['vaccine',t('layerVaccine')]];
  sel.innerHTML=opts.map(([v,l])=>'<option value="'+v+'"'+(v===activeLayer?' selected':'')+'>'+l+'</option>').join('');
  document.getElementById('layerLabel').textContent=t('colorBy');
}
document.getElementById('layerSelect').addEventListener('change',function(){activeLayer=this.value;updateMapColors();renderLegend();});
document.querySelectorAll('#langToggle span').forEach(s=>s.addEventListener('click',()=>{lang=s.dataset.lang;applyLang();}));

applyLang();
initMap();
</script>
